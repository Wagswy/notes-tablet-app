name: Build Notes Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Initialize Capacitor as "Notes"
        run: |
          npm install
          npx cap init "Notes" "com.tablet.notes" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Tablet-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
